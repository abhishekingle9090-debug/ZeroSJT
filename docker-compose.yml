version: '3.8'
services:
  db:
    image: postgres:15
    container_name: zerosjt-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vitpassword123
      POSTGRES_DB: zerosjt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: